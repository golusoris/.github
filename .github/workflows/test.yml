---
# Test suite: runs make test (tests/) on every pull request, on main and in
# the merge queue. The suite checks labels.yml, .bestpractices.json and the
# relative links of the rendered Markdown files.
name: Tests

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  merge_group:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: make test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Tests not run on a draft
          MESSAGE: >-
            The tests did not run because the pull request is a draft.
            They run when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        if: github.event.pull_request.draft != true
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: make test
        if: github.event.pull_request.draft != true
        run: |
          python3 -m venv "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests/bin/python" -m pip install \
            --require-hashes -r .config/tests/requirements.txt
          make test PYTHON="$RUNNER_TEMP/tests/bin/python"
