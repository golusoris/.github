---
# Scorecard: runs on ready pull requests, on main, weekly and on demand.
# The required check also runs in the merge queue, where analysis skips:
# scorecard-action accepts only the default branch and pull request events.
name: Scorecard

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ['main']
  push:
    branches: ['main']
  merge_group:
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Skip in the merge queue
        if: github.event_name == 'merge_group'
        run: >-
          echo "scorecard-action accepts only the default branch and pull request events, so the queue run passes without analysis."
          >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event.pull_request.draft != true && github.event_name != 'merge_group'
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        if: github.event.pull_request.draft != true && github.event_name != 'merge_group'
        with:
          results_file: results.sarif
          results_format: sarif
          # No id-token reaches the OpenSSF API from a pull request.
          publish_results: ${{ github.event_name != 'pull_request' }}
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event.pull_request.draft != true && github.event_name != 'merge_group'
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event.pull_request.draft != true && github.event_name != 'merge_group'
        with:
          sarif_file: results.sarif
